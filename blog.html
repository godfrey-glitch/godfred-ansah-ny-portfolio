<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — Godfred Nana Yaw Ansah</title>
<meta name="description" content="Essays and thoughts by Godfred Nana Yaw Ansah on PR, communications, and building Nyansa AI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15120E; --ink-2:#1C1812; --paper:#F0E9DE; --paper-mute:#9C948A;
    --gold:#C9A65A; --gold-dim:#8A733F; --rule: rgba(240,233,222,0.12);
    --serif: 'Playfair Display', Georgia, serif; --sans: 'Inter', system-ui, sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--ink);color:var(--paper);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:900px;margin:0 auto;padding:0 24px}

  header.site-nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(21,18,14,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;max-width:1080px;margin:0 auto}
  .nav-mark{font-family:var(--serif);font-style:italic;font-weight:600;font-size:18px}
  .nav-links{display:flex;gap:36px;list-style:none}
  .nav-links a{font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--paper-mute);transition:color .25s ease}
  .nav-links a:hover{color:var(--gold)}
  .nav-links a.active{color:var(--gold)}

  .page-head{padding:160px 24px 60px}
  .eyebrow{display:flex;align-items:center;gap:14px;font-size:12px;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);margin-bottom:24px}
  .eyebrow::before{content:'';width:32px;height:1px;background:var(--gold-dim)}
  .page-head h1{font-family:var(--serif);font-weight:600;font-size:clamp(36px,6vw,64px)}

  .posts{padding:20px 24px 120px}
  .post-card{display:block;padding:32px 0;border-bottom:1px solid var(--rule);transition:.2s ease}
  .post-card:hover .post-title{color:var(--gold)}
  .post-date{font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:10px}
  .post-title{font-family:var(--serif);font-size:26px;font-weight:600;margin-bottom:10px;transition:color .2s ease}
  .post-excerpt{color:var(--paper-mute);font-size:15px;max-width:65ch}

  .state-msg{color:var(--paper-mute);font-size:14px;padding:40px 0}
  .state-msg a{color:var(--gold);border-bottom:1px solid var(--gold-dim)}

  footer{padding:48px 24px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;max-width:1080px;margin:0 auto}
  footer p{font-size:12px;color:var(--paper-mute)}
  .to-top{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold-dim)}
  .to-top:hover{color:var(--gold)}

  @media(max-width:640px){
    .nav-links{gap:20px}
    .nav-links li:not(:last-child){display:none}
  }
</style>
</head>
<body>

<header class="site-nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-mark">G. Ansah</a>
    <ul class="nav-links">
      <li><a href="index.html">Portfolio</a></li>
      <li><a href="blog.html" class="active">Blog</a></li>
    </ul>
  </div>
</header>

<div class="page-head wrap">
  <div class="eyebrow">Writing</div>
  <h1>Blog</h1>
</div>

<div class="posts wrap" id="postsContainer">
  <p class="state-msg">Loading posts…</p>
</div>

<footer>
  <p>© 2026 Godfred Nana Yaw Ansah. All rights reserved.</p>
  <a href="#" class="to-top" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">Back to top ↑</a>
</footer>

<script>
  // ===== CONFIG =====
  const GITHUB_USER = "godfrey-glitch";
  const GITHUB_REPO = "godfred-ansah-ny-portfolio";
  const BRANCH = "main";
  // ===================

  const container = document.getElementById('postsContainer');

  function parseFrontmatter(raw) {
    const match = raw.match(/^---\s*([\s\S]*?)\s*---\s*([\s\S]*)$/);
    if (!match) return { data: {}, body: raw };
    const data = {};
    match[1].split('\n').forEach(line => {
      const idx = line.indexOf(':');
      if (idx === -1) return;
      const key = line.slice(0, idx).trim();
      let val = line.slice(idx + 1).trim();
      val = val.replace(/^['"]|['"]$/g, '');
      data[key] = val;
    });
    return { data, body: match[2].trim() };
  }

  function formatDate(dateStr) {
    const d = new Date(dateStr);
    if (isNaN(d)) return dateStr || '';
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  async function loadPosts() {
    if (!godfrey-glitch|| !godfred-ansah-ny-portfolio) {
      container.innerHTML = '<p class="state-msg">Blog isn\'t connected yet — set GITHUB_USER and GITHUB_REPO in blog.html once your repo is live.</p>';
      return;
    }
    try {
      const listUrl = `https://api.github.com/repos/${godfrey-glitch}/${godfred-ansah-ny-portfolio}/contents/content/blog?ref=${main}`;
      const listRes = await fetch(listUrl);
      if (!listRes.ok) throw new Error('Could not reach GitHub');
      const files = (await listRes.json()).filter(f => f.name.endsWith('.md'));

      if (files.length === 0) {
        container.innerHTML = '<p class="state-msg">No posts yet — publish your first one from <a href="/admin/">/admin</a>.</p>';
        return;
      }

      const posts = await Promise.all(files.map(async f => {
        const rawUrl = `https://cdn.jsdelivr.net/gh/${godfrey-glitch}/${godfred-ansah-ny-portfolio}@${main}/content/blog/${f.name}`;
        const res = await fetch(rawUrl);
        const raw = await res.text();
        const { data } = parseFrontmatter(raw);
        return {
          slug: f.name.replace(/\.md$/, ''),
          title: data.title || f.name,
          date: data.date || '',
          excerpt: data.excerpt || ''
        };
      }));

      posts.sort((a, b) => new Date(b.date) - new Date(a.date));

      container.innerHTML = posts.map(p => `
        <a class="post-card" href="post.html?slug=${encodeURIComponent(p.slug)}">
          <div class="post-date">${formatDate(p.date)}</div>
          <div class="post-title">${p.title}</div>
          <div class="post-excerpt">${p.excerpt}</div>
        </a>
      `).join('');
    } catch (err) {
      container.innerHTML = '<p class="state-msg">Couldn\'t load posts right now. Try refreshing, or check back shortly.</p>';
    }
  }

  loadPosts();
</script>

</body>
</html>
